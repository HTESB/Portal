<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>Folder Reader</title>
</head>
<body>

    <!-- The input allows folder selection -->
    <input type="file" id="folderInput" webkitdirectory directory multiple>
    
    <!-- This list will display the files -->
    <ul id="fileList"></ul>

    <script>
        document.getElementById('folderInput').addEventListener('change', function(event) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = ''; // Clear the list before adding new items

            // Loop through all files in the selected folder
            for (let i = 0; i < event.target.files.length; i++) {
                const file = event.target.files[i];
                const listItem = document.createElement('li');
                
                // webkitRelativePath shows the folder structure (e.g., "Folder/Subfolder/file.txt")
                listItem.textContent = file.webkitRelativePath; 
                fileList.appendChild(listItem);
            }
        });
    </script>

</body>
</html>
